openapi: 3.0.3
info:
  title: qone-advisor-api
  version: 2.0.0
  description: |
    AI advisor domain of Qampus (ADR-006, ADR-003): conversations, append-only messages and the
    enrollment plans the agent proposes and the student confirms. Operations AD-01..AD-08 of
    `../../endpoint-catalog.md`. The agent acts with the caller's identity (D-08); its only
    write is starting the `enroll-student` saga through `qone-workflow` with the advisor's
    service token (ADR-008). Read projections of catalog, enrollment and billing are fed by
    events. Shared components: `./_shared.yaml`. Data: `06-data/models.md`, schema `advisor`.

servers:
  - url: http://localhost:8080/api/v1
    description: Through qone-api-gateway

security:
  - bearerAuth: []

paths:
  /advisor/health:
    get:
      summary: Liveness of the advisor and whether the LLM is configured (AD-01)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvisorHealth' }

  /advisor/conversations:
    post:
      summary: Start a conversation (AD-02)
      description: Any role. The tool set is chosen from the token's `role` and every tool call is scoped to its `sub` (`INV-ADV-002`).
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Conversation created
          headers:
            Location: { $ref: './_shared.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '200':
          description: Same `Idempotency-Key` - the conversation created the first time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }

  /advisor/conversations/me:
    get:
      summary: My conversations, newest first (AD-03)
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Page'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }

  /advisor/conversations/{id}/messages:
    get:
      summary: Messages of one of my conversations, newest first (AD-04)
      description: Owner only; another user's conversation is `404` (D-03). Messages are append-only (`INV-ADV-004`).
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Id'
        - $ref: './_shared.yaml#/components/parameters/Page'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
    post:
      summary: Send a message and get the agent's reply (AD-05)
      description: |
        Owner only. Appends the user message and the assistant reply (`INV-ADV-004`). When the
        reply proposes an enrollment, `plan` carries a `PROPOSED` plan that expires in 10 minutes;
        nothing is enrolled until the student confirms (`INV-ADV-001`, `INV-ADV-003`). Without an
        API key, with the circuit open or on a provider error the reply is a fixed message with
        `degraded: true` and still `201` (D-02). The provider call has a 120 s budget.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Id'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Reply recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
        '200':
          description: Same `Idempotency-Key` - the reply produced the first time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

  /advisor/plans/{id}:
    get:
      summary: One of my plans (AD-06)
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

  /advisor/plans/{id}/confirm:
    post:
      summary: Confirm a proposed plan - starts the enrollment saga (AD-07)
      description: |
        Owner only. `PROPOSED` -> `EXECUTING`: the advisor records `confirmationId`, calls
        `POST /sagas/enroll-student` with its service token, `origin: AGENT`, the student's id
        and the confirmation id (`INV-ENR-005`, D-08), and answers `202` with the saga id. The
        plan becomes `EXECUTED` or `FAILED` when the saga ends (consumed from its events). A plan
        that is not `PROPOSED`, or whose `expiresAt` has passed, is `422 INVALID_STATUS_TRANSITION`.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Id'
      responses:
        '202':
          description: Saga started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanConfirmation' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: './_shared.yaml#/components/responses/InvalidTransition' }

  /advisor/plans/{id}/dismiss:
    post:
      summary: Dismiss a proposed plan (AD-08)
      description: Owner only. `PROPOSED` -> `DISMISSED`; dismissing a plan in any other state returns it unchanged (D-04).
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Id'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { $ref: './_shared.yaml#/components/securitySchemes/bearerAuth' }

  schemas:
    AdvisorHealth:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/Health'
        - type: object
          required: [llm]
          properties:
            llm: { type: string, enum: [configured, missing] }
            model: { type: string, nullable: true, example: gpt-4o-mini }

    Conversation:
      type: object
      required: [id, userId, userRole, model, createdAt]
      properties:
        id: { $ref: './_shared.yaml#/components/schemas/UUID' }
        userId: { $ref: './_shared.yaml#/components/schemas/UUID' }
        userRole: { $ref: './_shared.yaml#/components/schemas/Role' }
        model: { type: string }
        createdAt: { $ref: './_shared.yaml#/components/schemas/DateTime' }

    ConversationPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        meta: { $ref: './_shared.yaml#/components/schemas/PageMeta' }

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { $ref: './_shared.yaml#/components/schemas/UUID' }
        conversationId: { $ref: './_shared.yaml#/components/schemas/UUID' }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        createdAt: { $ref: './_shared.yaml#/components/schemas/DateTime' }

    MessagePage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        meta: { $ref: './_shared.yaml#/components/schemas/PageMeta' }

    PlanStatus:
      type: string
      description: '`PROPOSED` -> `EXECUTING` -> `EXECUTED` | `FAILED`; `PROPOSED` -> `DISMISSED` | `EXPIRED` (by qone-worker after 10 minutes)'
      enum: [PROPOSED, EXECUTING, EXECUTED, FAILED, DISMISSED, EXPIRED]

    Plan:
      type: object
      required: [id, conversationId, studentId, sectionId, summary, status, expiresAt, createdAt]
      properties:
        id: { $ref: './_shared.yaml#/components/schemas/UUID' }
        conversationId: { $ref: './_shared.yaml#/components/schemas/UUID' }
        studentId: { $ref: './_shared.yaml#/components/schemas/UUID' }
        sectionId: { $ref: './_shared.yaml#/components/schemas/UUID' }
        summary:
          type: object
          description: What the student confirms, frozen at proposal time
          required: [subjectCode, subjectName, groupNumber, professorName, slots, seatsAvailable, reason]
          properties:
            subjectCode: { type: string }
            subjectName: { type: string }
            groupNumber: { type: integer }
            professorName: { type: string }
            slots: { type: array, items: { $ref: './_shared.yaml#/components/schemas/Slot' } }
            seatsAvailable: { type: integer }
            reason: { type: string, description: Why the agent proposes this section }
        status: { $ref: '#/components/schemas/PlanStatus' }
        confirmationId:
          nullable: true
          allOf: [{ $ref: './_shared.yaml#/components/schemas/UUID' }]
        sagaId:
          nullable: true
          allOf: [{ $ref: './_shared.yaml#/components/schemas/UUID' }]
        expiresAt: { $ref: './_shared.yaml#/components/schemas/DateTime' }
        createdAt: { $ref: './_shared.yaml#/components/schemas/DateTime' }

    ChatReply:
      type: object
      required: [message, degraded]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        plan:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Plan' }]
        degraded: { type: boolean, description: True when the fixed fallback reply was used (D-02) }

    PlanConfirmation:
      type: object
      required: [plan, sagaId]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        sagaId: { $ref: './_shared.yaml#/components/schemas/UUID' }
