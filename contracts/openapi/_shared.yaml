openapi: 3.0.3
info:
  title: Qampus - common contract (shared components, v2)
  version: 2.0.0
  description: |
    The components every Qampus v2 contract shares, and the conventions of the course norm
    (numerals 5.3.5 to 5.3.9) written as schemas, parameters, headers and responses so a
    domain contract references them instead of restating them.

    Reference from a domain contract with `$ref: './_shared.yaml#/components/...'`. The
    prose version is `../../guidelines.md`; the invariant identifiers (INV-*) are defined in
    `02-domain/entities-and-rules.md`. Everything the prototype shipped (`v1.0.0`) is frozen in
    `v1/` and is not what the `qone-*-api` services implement.

servers:
  - url: http://localhost:8080/api/v1
    description: Through qone-api-gateway, the only entry point published to the host (5.6.1)

paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <jwt>`, signed **RS256** by `qone-identity-api`. Every service
        validates the token itself with the identity public key (`JWT_PUBLIC_KEY`): `alg` must
        be exactly `RS256` (anything else, including `none` and `HS256`, is 401), `exp` and `sub`
        are required, clock skew tolerated 30 s (5.3.7). The gateway only checks that the header
        exists. Claims: `sub` (user id, UUID), `role`, `name`, `exp`, `iat`. Service-to-service
        calls (`qone-workflow`, `qone-worker`) carry a service token issued by identity with
        `role: SERVICE`; a user token is never forwarded between services (ADR-008).

  parameters:
    Page:
      name: page
      in: query
      description: Page number, from 1 (5.3.6).
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100; 20 when omitted. Out of range is `400 VALIDATION_ERROR`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every operation that creates (5.3.8). 8 to 128 characters, one per
        intention, reused on every retry of the same intention. A repeated key returns the
        resource created the first time with `200` and does not create another; a missing or
        malformed key is `400 VALIDATION_ERROR` with `details[].field = "Idempotency-Key"`.
      schema: { type: string, minLength: 8, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Reused when present, generated by the gateway or the service when absent; returned in
        every response and used as `traceId` of the error envelope (5.3.9).
      schema: { type: string, minLength: 1, maxLength: 128 }
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier. A value that is not a UUID is `400`, not `404`.
      schema: { $ref: '#/components/schemas/UUID' }

  headers:
    XCorrelationId:
      description: The correlation id of this request, reused or generated (5.3.9).
      schema: { type: string }
    Location:
      description: Absolute or gateway-relative URL of the resource just created.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying (gateway rate limit).
      schema: { type: integer, minimum: 1 }

  schemas:
    UUID:
      type: string
      format: uuid
      description: UUID v4, lowercase, generated by the owning service
      example: 6f1d2c3e-9b7a-4e1f-8c2d-0a1b2c3d4e5f

    DateTime:
      type: string
      format: date-time
      description: RFC 3339 in UTC with a `Z` suffix (5.3.5)
      example: '2026-10-07T14:03:21Z'

    MoneyCents:
      type: integer
      format: int64
      minimum: 0
      description: |
        Money as an integer in the minor unit (COP cents); never a float. Field names end in
        `Cents` (`amountCents`, `paidCents`). Clients convert from the text the person typed,
        never by multiplying a floating-point number (5.4.3).
      example: 185000000

    Term:
      type: string
      pattern: '^[0-9]{4}-[AB]$'
      description: Academic term
      example: 2026-B

    Role:
      type: string
      description: '`SERVICE` is only present in service tokens (workflow, worker)'
      enum: [STUDENT, PROFESSOR, ADMIN, SERVICE]

    Slot:
      type: object
      description: |
        One weekly class block. Two slots overlap when they share the day and
        `start < other.end && other.start < end`; a class that ends when another starts does
        not overlap. Shared by catalog (sections) and enrollment (schedule snapshots).
      required: [day, start, end]
      properties:
        day: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT] }
        start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '08:00' }
        end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '10:00' }

    ErrorCode:
      type: string
      description: |
        The closed list of the norm (5.3.5) plus the two codes only the gateway emits
        (Annex F). A service never invents a code.
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATUS_TRANSITION
        - BUSINESS_RULE_VIOLATION
        - TOO_MANY_REQUESTS
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Body field (dot path), query parameter or header name
          example: Idempotency-Key
        message:
          type: string
          example: header required, 8 to 128 characters

    Error:
      type: object
      description: |
        The single error envelope, also for unknown routes and malformed JSON. `message` is for
        the person, in English, and never exposes a driver message, a stack trace or an internal
        host name (the full detail goes to the structured log under the same `traceId`). When the
        error enforces a documented invariant, `message` starts with its identifier
        (`INV-ENR-001: ...`) so a test, a log line and a screenshot trace to `02-domain`.
      required: [error, message, traceId]
      properties:
        error: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, example: 'INV-ENR-001: the student already has an active enrollment in this subject' }
        details:
          type: array
          description: Only with `VALIDATION_ERROR`, one entry per invalid field
          items: { $ref: '#/components/schemas/ErrorDetail' }
        traceId: { type: string, example: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    PageMeta:
      type: object
      description: Pagination metadata (5.3.6). `page` and `limit` repeat the effective values.
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        limit: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 37 }
        totalPages: { type: integer, minimum: 0, example: 2 }

    Health:
      type: object
      description: Answered without a token by every service and by the gateway
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: qone-catalog-api }
        version: { type: string, example: 2.0.0 }

  responses:
    BadRequest:
      description: Invalid input shape - a body field, a query parameter, a path id that is not a UUID, a malformed JSON document or a missing `Idempotency-Key`. `details` names each field.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: VALIDATION_ERROR
            message: the request has invalid fields
            details: [{ field: limit, message: must be between 1 and 100 }]
            traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e

    Unauthorized:
      description: No bearer token, a token whose `alg` is not RS256, a bad signature, or an expired token. The gateway answers the first case; the service answers all of them.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UNAUTHORIZED, message: missing or invalid token, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    Forbidden:
      description: The token is valid but its role may not perform the operation, or the resource belongs to another user and is not secret.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: FORBIDDEN, message: this role may not perform the operation, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    NotFound:
      description: The resource or the route does not exist, or the resource belongs to another user and revealing it would leak data (D-03).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NOT_FOUND, message: resource not found, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    InvalidTransition:
      description: The state rule of the domain forbids the transition (terminal state, expired proposal, already processed).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: INVALID_STATUS_TRANSITION, message: 'INV-BIL-002: a PAID invoice cannot change state', traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    BusinessRuleViolation:
      description: Another invariant of the domain forbids the operation; `message` starts with the invariant id.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: BUSINESS_RULE_VIOLATION, message: 'INV-SEC-002: the slots of a section must not overlap', traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    TooManyRequests:
      description: Emitted by the gateway when a client exceeds the rate limit; never by a service.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: TOO_MANY_REQUESTS, message: rate limit exceeded, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    ServiceUnavailable:
      description: Emitted by the gateway when the domain service behind the route does not answer; the other routes keep working (Annex F).
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: SERVICE_UNAVAILABLE, message: the service is not available, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }

    InternalError:
      description: Anything else. Neutral message; the full detail is only in the log under the same `traceId`.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: INTERNAL_ERROR, message: unexpected error, traceId: 7c1f4a2e-0b7d-4a5f-9a1e-3d2c1b0a9f8e }
