[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qone-advisor-api"
version = "2.0.0"
description = "AI advisor of Qampus: conversations, grounded answers over projections and enrollment plans"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "pika>=1.3,<2",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.2,<0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "pyyaml>=6,<7",
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# Domain errors are named after the contract codes (BusinessRuleViolation), not with a suffix.
ignore = ["N818"]
